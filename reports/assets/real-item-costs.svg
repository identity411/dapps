    <text x="208" y="234.2" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">AK-47 | Redline</text>
    <text x="208" y="251.2" text-anchor="end" font-size="11" fill="#6b7280">$32.13 · FT</text>
    <rect x="220" y="214.2" width="409.5" height="11" rx="2" fill="#d1495b"/>
