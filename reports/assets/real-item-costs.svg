  <text x="220" y="478" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b7280">Log scale. Seller fees only; SkinPact gas is a fixed per-trade cost. Gas exceeds the 1.5%/1% fees on all four items.</text>
