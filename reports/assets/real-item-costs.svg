    <rect x="220" y="246.2" width="122.9" height="11" rx="2" fill="#2e7d32"/>
    <text x="347.9" y="255.2" font-size="10.5" fill="#145c43">$0.32</text>
    <text x="208" y="311.8" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">AWP | Asiimov</text>
    <text x="208" y="328.8" text-anchor="end" font-size="11" fill="#6b7280">$127.42 · FT</text>
    <rect x="220" y="291.8" width="555.1" height="11" rx="2" fill="#d1495b"/>
    <text x="780.1" y="300.8" font-size="10.5" fill="#7f1d1d">$19.11</text>
    <rect x="220" y="307.8" width="311.7" height="11" rx="2" fill="#b45309"/>
    <text x="536.7" y="316.8" font-size="10.5" fill="#7a4506">$1.91</text>
    <rect x="220" y="323.8" width="268.6" height="11" rx="2" fill="#2e7d32"/>
    <text x="493.6" y="332.8" font-size="10.5" fill="#145c43">$1.27</text>
    <text x="208" y="389.2" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">M4A1-S | Printstream</text>
