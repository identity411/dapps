<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img">
  <title>Platform fee versus SkinPact gas on four real CS2 items</title>
  <desc>Horizontal log-scale bar chart comparing Steam, BUFF, and YouPin seller fees with the fixed SkinPact gas cost on four Steam Market items.</desc>
  <rect width="1040" height="500" fill="#ffffff"/>
  <text x="220" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">Platform fee vs SkinPact gas</text>
  <text x="220" y="61" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563">Seller fee in USD vs a fixed gas cost of $35.20 (10 gwei, $3,000/ETH). Steam prices: 2026-11-07.</text>

  <rect x="220" y="78" width="11" height="11" rx="2" fill="#d1495b"/>
  <text x="237" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#374151">Steam 15%</text>
  <rect x="330" y="78" width="11" height="11" rx="2" fill="#b45309"/>
  <text x="347" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#374151">BUFF 1.5%</text>
  <rect x="430" y="78" width="11" height="11" rx="2" fill="#2e7d32"/>
  <text x="447" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#374151">YouPin 1%</text>
  <line x1="548" y1="84" x2="578" y2="84" stroke="#175c86" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="585" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#175c86">SkinPact gas</text>

  <line x1="220" y1="120" x2="950" y2="120" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="220" y1="430" x2="950" y2="430" stroke="#9ca3af" stroke-width="1"/>
  <line x1="220" y1="120" x2="220" y2="430" stroke="#9ca3af" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="220" y="450">$0.10</text>
    <text x="463" y="450">$1</text>
    <text x="707" y="450">$10</text>
    <text x="950" y="450">$100</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="220" y1="120" x2="220" y2="430"/>
    <line x1="463" y1="120" x2="463" y2="430"/>
    <line x1="707" y1="120" x2="707" y2="430"/>
    <line x1="950" y1="120" x2="950" y2="430"/>
  </g>

  <line x1="840" y1="120" x2="840" y2="430" stroke="#175c86" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="834" y="111" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#175c86">SkinPact gas $35.20</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="208" y="156.8" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">Glock-18 | Water Elemental</text>
    <text x="208" y="173.8" text-anchor="end" font-size="11" fill="#6b7280">$21.79 · FT</text>
