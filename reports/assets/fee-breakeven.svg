<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img">
<title>SkinPact break-even item price versus gas price</title>
<desc>Break-even item price for 1%, 2.5% and 5% platform-fee tiers, comparing Sepolia Amsterdam gas with local Hardhat Osaka gas, assuming ETH at 3000 USD.</desc>
<rect width="1040" height="680" fill="#ffffff"/>
<text x="96" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#111827">Break-even item price vs gas price</text>
<text x="96" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4b5563">ETH = $3,000 (illustrative). Happy path = createListing + buy + markOfferSent + confirmReceipt.</text>
<text x="96" y="90" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4b5563">Solid = Sepolia (1,173,272 gas); dashed = local (374,508 gas). Break-even = gas cost / fee rate.</text>
