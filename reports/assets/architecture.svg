<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img">
  <title>SkinPact trust boundaries</title>
  <desc>User devices, the off-chain Relay, the on-chain SkinPactMarket and arbiter, and Steam, with labeled data flows.</desc>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="300" height="480" rx="8" fill="#f4f7fa" stroke="#c9d5e1" stroke-dasharray="6 5"/>
  <text x="38" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.2" fill="#64748b">USER DEVICES</text>

  <rect x="44" y="78" width="252" height="112" rx="6" fill="#ffffff" stroke="#b8c5d3"/>
  <text x="62" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#121821">Buyer &amp; seller web</text>
  <text x="62" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#5b6778">React · MetaMask</text>
  <text x="62" y="154" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#5b6778">Market · Orders · Trade Room</text>

  <rect x="44" y="300" width="252" height="112" rx="6" fill="#ffffff" stroke="#b8c5d3"/>
  <text x="62" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#121821">Seller local helper</text>
  <text x="62" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#5b6778">Steam session · QR login</text>
  <text x="62" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#5b6778">offer send / observe</text>

  <rect x="360" y="20" width="260" height="480" rx="8" fill="#eef4f8" stroke="#9db9cc"/>
  <text x="378" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.2" fill="#175c86">SKINPACT OFF-CHAIN</text>

  <rect x="384" y="150" width="212" height="200" rx="6" fill="#ffffff" stroke="#175c86"/>
  <text x="402" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#121821">Relay</text>
  <text x="402" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">nonce / JWT auth</text>
  <text x="402" y="229" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">encrypted Trade URL</text>
  <text x="402" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">helper pairing</text>
  <text x="402" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">evidence ledger</text>
  <text x="402" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">no fund custody</text>

  <rect x="672" y="64" width="278" height="130" rx="6" fill="#e7f0f7" stroke="#175c86" stroke-width="1.5"/>
  <text x="690" y="94" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0e3f5c">SkinPactMarket</text>
  <text x="690" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#33566d">escrow · bond · pull payments</text>
  <text x="690" y="143" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#33566d">status machine · no owner</text>
  <text x="690" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#33566d">immutable arbiter</text>

  <rect x="672" y="220" width="278" height="100" rx="6" fill="#fdf3e7" stroke="#b45309"/>
  <text x="690" y="250" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7a4506">Arbiter</text>
  <text x="690" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7a4506">off-chain evidence review</text>
  <text x="690" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7a4506">resolveDispute · trusted EOA</text>

  <rect x="672" y="370" width="278" height="105" rx="6" fill="#eef2f0" stroke="#64748b"/>
  <text x="690" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155">Steam Community</text>
  <text x="690" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">trade offers · item custody</text>
  <text x="690" y="449" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6778">buyer accepts in Steam Guard</text>

  <path d="M 296 112 L 320 112 L 320 30 L 700 30 L 700 64" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="455" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#475569">tx: list / buy / mark / confirm / dispute</text>

  <path d="M 296 160 L 384 218" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="298" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#475569">auth</text>

  <path d="M 296 356 L 384 322" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="298" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#475569">orders</text>

  <path d="M 596 170 L 672 145" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="600" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#475569">reads state</text>

  <path d="M 811 220 L 811 194" fill="none" stroke="#b45309" stroke-width="1.7" marker-end="url(#arrowAmber)"/>
  <text x="822" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#7a4506">resolveDispute</text>

  <path d="M 296 392 C 440 392 520 408 672 420" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="448" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#475569">send offer · observe Accepted(3)</text>

  <text x="38" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">No off-chain component can move escrow.</text>
  <text x="378" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#175c86">The Relay can decrypt Trade URLs.</text>
  <text x="698" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">The arbiter is the only privileged role.</text>
</svg>
